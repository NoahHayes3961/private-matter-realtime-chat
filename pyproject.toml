[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "private-matter-chat"
version = "0.1.0"
description = "Typed legal matter chat workflows over the Infrai realtime REST API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
matter-chat = "matter_chat.matter_service:run"

[tool.hatch.build.targets.wheel]
packages = ["src/matter_chat"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
